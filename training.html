<!doctype html>
<html lang="th" data-training-page="1">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#080f17">
  <title>ARIS Training Lab</title>
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;background:#080f17;color:#d7e3f2}
    body{font-family:"IBM Plex Sans Thai","Segoe UI",Tahoma,sans-serif;-webkit-font-smoothing:antialiased}
    button,select,input{font:inherit}
    button{cursor:pointer}
    .training-page-boot{min-height:100vh;display:grid;place-items:center;padding:24px;background:linear-gradient(180deg,#0b131e,#080f17)}
    .training-page-boot div{display:grid;gap:8px;text-align:center}
    .training-page-boot b{font-size:18px;color:#e8eff8}
    .training-page-boot span{font-size:12px;color:#7f92a8}
  </style>
</head>
<body>
  <div id="training-page-root">
    <div class="training-page-boot" id="training-page-boot">
      <div><b>ARIS Training Lab</b><span>กำลังเปิดระบบเทรน…</span></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/lightweight-charts@5.0.8/dist/lightweight-charts.standalone.production.js"></script>
  <script src="entry-score.js?v=20261001-r1"></script>
  <script src="audit-calibration.js?v=20261001-r2"></script>
  <script src="audit-engine.js?v=20261001-r4"></script>
  <script src="historical-data.js?v=20261003-r4"></script>
  <script src="training-engine-registry.js?v=20261006-r1"></script>
  <script src="replay-engine.js?v=20261001-r7"></script>
  <script src="training-analytics.js?v=20261001-r1"></script>
  <script src="10-candle-challenge.js?v=20261003-r10"></script>
  <script src="training-lab.js?v=20261004-r18"></script>
  <script>
    window.addEventListener('DOMContentLoaded',()=>{
      const boot=document.getElementById('training-page-boot');
      if(boot)boot.remove();
    },{once:true});
  </script>
</body>
</html>
